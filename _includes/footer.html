<div class="footer-wrapper">
  <p class="footer-intro">Delavnice se izvajajo v sklopu projektov, ki jih financira Ministrstvo za digitalno preobrazbo, vendar vsebina ne odraža stališč Ministrstva za digitalno preobrazbo.</p>
  <footer>
    <img src="{{site.baseurl}}/assets/img/logo-feri.png" alt="logo" class="footer-logo" />
  </footer>
</div>

<script type="application/ld+json">
{
  "@context": "http://schema.org",
  "@type": "Organization",
  "name": "{{ site.name }}",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}{{site.baseurl}}/",
  "logo": {
      "@type": "ImageObject",
      "url": "{{site.baseurl}}/assets/img/icons/mediumtile.png",
      "width": "600",
      "height": "315"
  },
  "sameAs": [
    {{ social_urls | split: "," | join: "," }}
  ]
}
</script>

<!-- Include the script that allows Netlify CMS login -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<!-- Include the website scripts -->
<script src="{{ '/assets/js/scripts.min.js' | prepend: site.baseurl }}"></script>

<!-- Include Google Analytics script -->
{% include stats.html %}

<!-- Include extra scripts -->
{% include extra-js.html %}
